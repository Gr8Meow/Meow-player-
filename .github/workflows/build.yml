name: Build Meow Player

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned libmpv build (LGPL) and its checksum. Update both together.
  LIBMPV_REPO: zhongfly/mpv-winbuild
  LIBMPV_TAG: 2026-11-01-add72571ea
  LIBMPV_ASSET: mpv-dev-lgpl-x86_64-20261101-git-add72571ea.7z
  LIBMPV_SHA256: a05f80aa36faecc25af840dca3a24af0cd32fa42a114bf7ea91dc21a80376f6c

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable Git Long Paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Generate version.h from the release tag
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if ($env:REF_NAME -match '^v(\d+(\.\d+){0,3})$') { $ver = $Matches[1] } else { $ver = "0.0.0-dev" }
          "#define APP_VERSION `"$ver`"" | Out-File version.h -Encoding ascii
          "#define UPDATE_REPO `"$env:REPO`"" | Out-File version.h -Encoding ascii -Append
          Get-Content version.h

      - name: Compile (hardened)
        shell: cmd
        run: >
          cl /O2 /EHsc /MT /GS /guard:cf /DUNICODE /D_UNICODE meowplayer.cpp
          /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup
          /guard:cf /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA /DEPENDENTLOADFLAG:0x800
          user32.lib gdi32.lib shell32.lib ole32.lib comdlg32.lib advapi32.lib
          shlwapi.lib dwmapi.lib gdiplus.lib winhttp.lib

      - name: Download and verify libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:LIBMPV_TAG -R $env:LIBMPV_REPO --pattern $env:LIBMPV_ASSET --dir libmpv
          $hash = (Get-FileHash "libmpv/$env:LIBMPV_ASSET" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:LIBMPV_SHA256) { throw "libmpv checksum mismatch: $hash" }
          7z x -y "-olibmpv/x" "libmpv/$env:LIBMPV_ASSET" libmpv-2.dll

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/MeowPlayer | Out-Null
          Copy-Item meowplayer.exe, LICENSE, README.md, THIRD-PARTY.md dist/MeowPlayer/
          Copy-Item libmpv/x/libmpv-2.dll dist/MeowPlayer/
          Compress-Archive -Path dist/MeowPlayer -DestinationPath MeowPlayer-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MeowPlayer-windows-x64
          path: MeowPlayer-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MeowPlayer-windows-x64
      - name: Checksum
        run: sha256sum MeowPlayer-windows-x64.zip > MeowPlayer-windows-x64.zip.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            MeowPlayer-windows-x64.zip
            MeowPlayer-windows-x64.zip.sha256
