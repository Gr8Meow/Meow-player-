name: Build LiveWall

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: the build only reads the repo. The release job asks for more.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Generate version.h from the release tag
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if ($env:REF_NAME -match '^v(\d+(\.\d+){0,3})$') { $ver = $Matches[1] } else { $ver = "0.0.0-dev" }
          "#define APP_VERSION `"$ver`"" | Out-File version.h -Encoding ascii
          "#define UPDATE_REPO `"$env:REPO`"" | Out-File version.h -Encoding ascii -Append
          Get-Content version.h

      - name: Compile (hardened)
        shell: cmd
        run: >
          cl /O2 /EHsc /MT /GS /guard:cf /DUNICODE /D_UNICODE livewall.cpp
          /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup
          /guard:cf /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA /DEPENDENTLOADFLAG:0x800
          user32.lib gdi32.lib shell32.lib ole32.lib comdlg32.lib advapi32.lib
          shlwapi.lib dwmapi.lib gdiplus.lib mfplay.lib winhttp.lib

      - uses: actions/upload-artifact@v4
        with:
          name: livewall-windows
          path: livewall.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: livewall-windows
      - name: Checksum
        run: sha256sum livewall.exe > livewall.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            livewall.exe
            livewall.exe.sha256
